apiVersion: apps/v1
kind: Deployment

metadata:
  name: coffee-web
  namespace: default

spec:
  replicas: 1

  selector:
    matchLabels:
      app: coffee-web

  template:
    metadata:
      labels:
        app: coffee-web

    spec:
      containers:
      - name: coffee-web
        image: crqlcoffee2026.azurecr.io/coffee-web:68852233b27adcac7a59335d80523f7a9ca87a18

        imagePullPolicy: Always

        ports:
        - containerPort: 80