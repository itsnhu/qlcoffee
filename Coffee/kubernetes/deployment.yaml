apiVersion: apps/v1
kind: Deployment

metadata:
  name: coffee-web
  namespace: default

spec:
  replicas: 1

  selector:
    matchLabels:
      app: coffee-web

  template:
    metadata:
      labels:
        app: coffee-web

    spec:
      containers:
      - name: coffee-web
        image: crqlcoffee2026.azurecr.io/coffee-web:4aee92619ca7d48612ed531799eb30acea2284d5

        imagePullPolicy: Always

        ports:
        - containerPort: 80